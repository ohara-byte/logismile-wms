name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # DB は不要：next build は Prisma Client の生成のみを要求し、
    # 実 DB 接続を伴うページが無いため（Dockerfile の builder 段も env を渡していない）。
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        # Dockerfile（node:20-bookworm-slim）／CLAUDE.md §2（Node.js 20.x LTS）と揃える
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client が無いと typecheck / build が落ちる（Dockerfile builder 段と同順）
      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # ★ タイムゾーンを変えて2回まわす（2026-10-01）。
      #   日付の扱いが実行環境の TZ に依存していると、ここで必ず落ちる。
      #
      #   以前は vitest.config.ts が TZ=Asia/Tokyo を固定しており、
      #   TZ 依存のコードが素通りしていた（report-period.ts の境界計算が該当）。
      #   本番コンテナの TZ 設定は効いていない場合があるため（CraftSmile ADR-042）、
      #   「設定が効いていなくても正しい」ことを機械的に担保する。
      - name: Unit tests (TZ=UTC・TZ 設定が効いていない場合)
        run: npm test
        env:
          TZ: UTC

      - name: Unit tests (TZ=Asia/Tokyo・本番で意図している設定)
        run: npm test
        env:
          TZ: Asia/Tokyo

      - name: Build
        run: npm run build
